# anabee.org — static site on /var/www/anabee.org
# Install:
#   scp scripts/nginx-anabee.org.conf root@HOST:/etc/nginx/sites-available/anabee.org
#   ln -sf /etc/nginx/sites-available/anabee.org /etc/nginx/sites-enabled/
#   certbot --nginx -d anabee.org -d www.anabee.org

server {
    listen 80;
    listen [::]:80;
    server_name anabee.org www.anabee.org;

    root /var/www/anabee.org;
    index index.html;

    # Temporarily hide ADNOC League surfaces
    location = /adnoc-league.html {
        return 302 /;
    }
    location = /blog/ana-beei-football.html {
        return 302 /blog/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/anabee.access.log;
    error_log  /var/log/nginx/anabee.error.log;
}
