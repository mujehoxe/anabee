# ANABEE Academy — Frappe Learning (https://github.com/frappe/lms)
# Local: npm run academy:up  →  http://localhost:8000/lms
# First boot installs bench + LMS (~10–15 min). Later starts are fast.

name: anabee-academy

services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-123}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: unless-stopped

  frappe:
    image: frappe/bench:latest
    restart: unless-stopped
    command: bash /workspace/init.sh
    environment:
      SHELL: /bin/bash
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-123}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - frappe-bench:/home/frappe/frappe-bench
    ports:
      - "${ACADEMY_HTTP_PORT:-8000}:8000"
      - "9000:9000"
    depends_on:
      - mariadb
      - redis

volumes:
  mariadb-data:
  frappe-bench:
